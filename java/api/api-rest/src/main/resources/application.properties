quarkus.application.name=sleeper-api

quarkus.lambda-http.enable-security=true

quarkus.s3.sync-client.type=url
quarkus.s3.devservices.enabled=false

# By default, require auth for all endpoints
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Allow unauthenticated access to the following
quarkus.http.auth.permission.public.paths=/api/v1/auth/info,/q/health,/q/health/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.public.methods=GET

# Allow preflight requests
quarkus.http.auth.permission.preflight.paths=/*
quarkus.http.auth.permission.preflight.policy=permit
quarkus.http.auth.permission.preflight.methods=OPTIONS

# An endpoint that says nothing about who may call it is refused
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Enable CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept
